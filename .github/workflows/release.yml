# SPDX-License-Identifier: GPL-3.0-or-later
# Build the Linux AppImage + tarball on a tag and attach them to the release.
# (The Windows installer is build-windows.yml; both fire on the same tag.)
#
# Runs on ubuntu-22.04 on purpose: an AppImage links against the glibc of the
# machine that built it, so building on the newest runner would produce a file
# that only starts on the newest distros. 22.04 covers 22.04, 24.04 and 26.04.
name: release-linux

on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # so the pipeline can be exercised without a tag

permissions:
  contents: write           # to upload the assets to the release

# The bundle's --check fails if the Rust engine is missing (core._native).
env:
  INGETRAZO_REQUIRE_RUST: "1"

jobs:
  appimage:
    name: AppImage + tarball (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages
        run: |
          sudo apt-get update -qq
          # libegl/libgl for Qt, fuse for appimagetool, xvfb for the smoke test
          sudo apt-get install -y --no-install-recommends \
            curl file libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libfuse2 xvfb

      - name: Python dependencies
        run: |
          python -m venv venv
          ./venv/bin/python -m pip install --quiet --upgrade pip
          ./venv/bin/python -m pip install --quiet PySide6==6.11.2 numpy pytest pyinstaller 'ezdxf>=1.4.4' 'manifold3d>=3.5.3'
          # openskp: UPSTREAM main — every IngeTrazo patch is merged there
          # (legacy corpus 186/186 PRs #194/#199, annotations write+read
          # PR #203). Pinned by SHA like build-windows.yml so both
          # installers ship the same reader/writer; advance the SHA when
          # upstream lands something we need.
          ./venv/bin/python -m pip install --quiet "openskp @ git+https://github.com/iamahsanmehmood/openskp@291700bc213655a00461838de71e5f206311e619#subdirectory=packages/python"
          ./venv/bin/python -c "import openskp, openskp.legacy; print('openskp OK')"

      # The Rust engine (rust/ingetrazo_core, Preferences ▸
      # General; on by default since 0.5.10). A build that cannot compile it fails here
      # instead of shipping without it.
      - uses: dtolnay/rust-toolchain@stable

      - name: Rust engine
        run: |
          ./venv/bin/python -m pip install --quiet maturin
          ./venv/bin/maturin build --release -m rust/ingetrazo_core/Cargo.toml -o "$RUNNER_TEMP/wheels"
          ./venv/bin/python -m pip install "$RUNNER_TEMP"/wheels/ingetrazo_core-*.whl
          INGETRAZO_RUST=1 ./venv/bin/python -c "import core._native as n; assert n.native is not None; print('engine:', n.engine())"

      - name: Tests
        # The slow marker is long fuzz sweeps; the release gate is the fast set,
        # in batches (one process each: the whole set no longer fits in a
        # runner's memory — scripts/pytest_batches.py).
        run: ./venv/bin/python scripts/pytest_batches.py -m "not slow" tests

      - name: Build the AppImage and the tarball
        run: packaging/build-appimage.sh dist

      # build-appimage.sh already ran --check on the bundle and on the
      # AppImage. This is the harder question: does it start a real GUI?
      - name: Smoke test with a display
        run: |
          APP=$(ls dist/IngeTrazo-*-x86_64.AppImage)
          # No --exit-after flag, so give it a few seconds and require that it
          # was still alive: a crash on startup exits well before the timeout.
          set +e
          xvfb-run -a timeout 25 "$APP" > smoke.log 2>&1
          rc=$?
          set -e
          cat smoke.log
          if [ "$rc" != "124" ]; then
            echo "!! the AppImage exited with $rc instead of surviving to the timeout"
            exit 1
          fi
          echo "OK — started and stayed up"

      # The tarball is the same bundle without the AppImage wrapper. Prove it
      # runs after extraction, not just that it was packed.
      - name: Smoke test the tarball
        run: |
          mkdir -p tarcheck && tar -C tarcheck -xzf dist/IngeTrazo-*-linux-x86_64.tar.gz
          tarcheck/IngeTrazo-*/ingetrazo --check

      # The 3djlchb edition as a .deb (Debian, LMDE, Ubuntu, Mint), wrapping
      # the bundle build-appimage.sh left in build/pyi.
      - name: Build the .deb
        run: PYTHON=./venv/bin/python packaging/build-deb.sh build/pyi/ingetrazo dist

      # Installed through apt as a user would, it must find its data, start
      # a real GUI, and leave nothing behind when removed.
      - name: Smoke test the .deb
        run: |
          sudo apt-get install -y ./dist/ingetrazo-3djlchb_*_amd64.deb
          ingetrazo-3djlchb --check
          test -f /usr/share/applications/ingetrazo-3djlchb.desktop
          set +e
          xvfb-run -a timeout 25 ingetrazo-3djlchb > deb-smoke.log 2>&1
          rc=$?
          set -e
          cat deb-smoke.log
          if [ "$rc" != "124" ]; then
            echo "!! the installed .deb exited with $rc instead of surviving to the timeout"
            exit 1
          fi
          sudo apt-get remove -y ingetrazo-3djlchb
          test ! -e /opt/ingetrazo-3djlchb && test ! -e /usr/bin/ingetrazo-3djlchb

      - uses: actions/upload-artifact@v4
        with:
          name: IngeTrazo-3djlchb-deb-amd64
          path: dist/ingetrazo-3djlchb_*_amd64.deb
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: IngeTrazo-AppImage-x86_64
          path: dist/IngeTrazo-*-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: IngeTrazo-tarball-x86_64
          path: dist/IngeTrazo-*-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release usually exists already (created by hand with notes, or
          # by build-windows.yml); create a bare one only if we got here first.
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --title "IngeTrazo ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" \
            dist/IngeTrazo-*-x86_64.AppImage \
            dist/IngeTrazo-*-linux-x86_64.tar.gz \
            dist/ingetrazo-3djlchb_*_amd64.deb --clobber
          # The example documents, under a name without the version so the
          # website can point at .../releases/latest/download/ for good.
          (cd examples && zip -q -r ../IngeTrazo-ejemplos.zip .)
          gh release upload "${GITHUB_REF_NAME}" IngeTrazo-ejemplos.zip --clobber

  # 3djlchb edition: no Snap job. Upstream's snap is named «ingetrazo»
  # (packaging/snap/snapcraft.yaml.in): built here it would carry this
  # edition under the official name and take its place on a machine.
  # tests/test_edition_3djlchb.py says so if a merge brings it back.
